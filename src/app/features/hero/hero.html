<section id="hero" class="relative min-h-screen flex items-center justify-center overflow-hidden">

  <!-- Orbes de fondo animados -->
  <div class="absolute inset-0 pointer-events-none">
    <div class="absolute top-1/4 left-1/4 w-96 h-96 rounded-full
                bg-accent-cyan/5 blur-3xl animate-pulse-slow"></div>
    <div class="absolute bottom-1/4 right-1/4 w-96 h-96 rounded-full
                bg-accent-violet/5 blur-3xl animate-pulse-slow"
         style="animation-delay: 2s"></div>
  </div>

  <!-- Partículas flotantes -->
  <div class="absolute inset-0 pointer-events-none overflow-hidden">
    @for (particle of particles; track particle.id) {
      <div
        [class]="'absolute rounded-full bg-accent-cyan ' + particle.animClass"
        [style.width.px]="particle.size"
        [style.height.px]="particle.size"
        [style.left]="particle.x + '%'"
        [style.top]="particle.y + '%'"
        [style.opacity]="particle.opacity"
        [style.--duration]="particle.duration"
        [style.--delay]="particle.delay"
      ></div>
    }
  </div>

  <!-- Contenido principal -->
  <div class="relative z-10 flex flex-col md:flex-row items-center justify-center gap-8 px-4 max-w-6xl mx-auto pt-18 md:pt-0">

    <!-- Foto de perfil -->
    <div class="animate-fade-in-left relative flex-shrink-0" style="animation-delay: 0.2s">

      <!-- Halo exterior suave -->
      <div class="absolute -inset-4 rounded-full"
           style="background: radial-gradient(circle, rgba(85,177,164,0.432) 0%, transparent 70%);
                  animation: pulse 4s ease-in-out infinite;">
      </div>

      <!-- Borde sutil -->
      <div class="p-[2px] rounded-full"
           style="background: linear-gradient(135deg, rgba(110,231,247,0.3), rgba(167,139,250,0.2));">

        <!-- Imagen -->
        <div class="w-48 h-48 md:w-72 md:h-72 lg:w-96 lg:h-96 xl:w-[480px] xl:h-[480px] rounded-full overflow-hidden"
             style="animation: float 6s ease-in-out infinite;
                    background: #0D1117;">
          <img
            src="perfil.png"
            alt="Kevin Quevedo"
            class="w-full h-full object-cover object-top"
            style="opacity: 0.85; filter: brightness(0.9) contrast(1.05);"
          />
        </div>

      </div>
    </div>

    <!-- Texto -->
    <div class="text-center md:text-left">

      <!-- Label superior -->
      <p class="animate-fade-in-down font-mono text-accent-cyan text-sm tracking-[0.3em] uppercase mb-6"
         style="animation-delay: 0.4s">
        Senior Software Engineer
      </p>

      <!-- Nombre -->
      <h1 class="animate-fade-in-up font-display text-4xl md:text-7xl font-bold mb-4"
          style="animation-delay: 0.6s">
        <span class="text-white">Kevin</span>
        <span class="gradient-text"> Quevedo</span>
      </h1>

      <!-- Tagline rotativa -->
      <p class="animate-fade-in-up font-body text-xl text-white/50 mb-12 h-8"
         style="animation-delay: 0.8s">
        {{ currentTagline() }}
        <span class="text-accent-cyan cursor-blink">|</span>
      </p>

      <!-- Botones -->
      <div class="animate-fade-in-up flex flex-col sm:flex-row gap-4 justify-center md:justify-start"
           style="animation-delay: 1s">
        <a href="#projects" class="btn-glow">
          Ver proyectos
        </a>
        <a href="#contact"
           class="px-6 py-3 font-mono text-sm font-medium tracking-wider uppercase
                  text-white/60 border border-white/10 rounded-lg
                  hover:text-white hover:border-white/30 transition-all duration-300">
          Contacto
        </a>
      </div>

      <!-- Redes sociales -->
      <div class="animate-fade-in-up flex gap-6 mt-8 justify-center md:justify-start"
           style="animation-delay: 1.2s">
        <a href="https://github.com/kevquevedo" target="_blank"
           class="font-mono text-xs tracking-wider uppercase text-white/30
                  hover:text-accent-cyan transition-colors duration-300 flex items-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
          </svg>
          GitHub
        </a>
        <a href="https://www.linkedin.com/in/kevin-quevedo/" target="_blank"
           class="font-mono text-xs tracking-wider uppercase text-white/30
                  hover:text-accent-cyan transition-colors duration-300 flex items-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
          </svg>
          LinkedIn
        </a>
      </div>

    </div>
  </div>

</section>
